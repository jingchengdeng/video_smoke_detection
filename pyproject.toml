[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-smoke-detection"
version = "0.1.0"
description = "Legacy smoke detection pipeline modernized into a testable package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "scikit-video",
]

[project.scripts]
video-smoke-detection = "video_smoke_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
